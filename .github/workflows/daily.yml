# Deploys static site via GitHub’s official Pages Actions flow.
# In the repo: Settings → Pages → Build and deployment → Source → "GitHub Actions"
# (If Source is left on "Deploy from branch" / gh-pages only, this workflow’s deploy step will not publish — use this source instead.)

name: Tomato Tech News Daily Automation

on:
  schedule:
    # 仅工作日 Mon–Fri，UTC 08:00（北京时间 16:00）
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated YYYY-MM-DD to backfill. Empty runs the previous weekday.'
        required: false
        type: string
  push:
    branches:
      - main
      - tomatonewsdaily
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write # commit docs/ after each run so Pages keeps past daily HTML URLs
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --days 1：上一工作日，时区由 NEWS_DATE_TZ 决定（默认见 scripts/config.py）。
      # workflow_dispatch 可传 dates=2026-11-17,2026-11-18 补跑指定日期。
      # 推送提交信息含 [no run] 时跳过本步，避免改 workflow 时重跑上一工作日。
      - name: Run News Pipeline
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no run]')
        env:
          BACKFILL_DATES: ${{ github.event.inputs.dates }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_TO: ${{ secrets.NOTIFICATION_TO }}
          NOTIFICATION_TO_ZH: ${{ secrets.NOTIFICATION_TO_ZH }}
          NOTIFICATION_TO_EN: ${{ secrets.NOTIFICATION_TO_EN }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION || 'false' }}
          FIREFLY_API_KEY: ${{ secrets.FIREFLY_API_KEY }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SKIP_WEEKENDS: ${{ vars.SKIP_WEEKENDS || 'true' }}
          # Optional override; if unset/empty, Python uses DEFAULT_NEWS_DATE_TZ in scripts/config.py
          NEWS_DATE_TZ: ${{ vars.NEWS_DATE_TZ }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scripts
          if [ -n "$BACKFILL_DATES" ]; then
            IFS=',' read -ra DAYS <<< "$BACKFILL_DATES"
            for raw in "${DAYS[@]}"; do
              day=$(printf '%s' "$raw" | tr -d '[:space:]')
              case "$day" in
                [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
                *) echo "Invalid date: $day"; exit 1 ;;
              esac
              echo "===== Backfill $day ====="
              python scripts/main.py --date "$day"
            done
          else
            python scripts/main.py --days 1
          fi

      - name: Commit and push docs (keep past daily links on GitHub Pages)
        if: success() && (github.ref_name == 'main' || github.ref_name == 'tomatonewsdaily')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs
          if git diff --staged --quiet; then
            echo "No docs/ changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(pages): publish daily HTML [skip actions]"
          if ! git push origin "HEAD:refs/heads/${{ github.ref_name }}"; then
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:refs/heads/${{ github.ref_name }}"
          fi

      - name: Verify Output
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "Error: index.html not found in docs/"
            exit 1
          fi
          echo "Build successful, found docs/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          include-hidden-files: true

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-artifacts
          path: docs/
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
